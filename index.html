function renderSalesTab(box){
  const o = state.office;
  box.innerHTML = `
    <div class="row2" style="margin-bottom:12px;">
      <div><label class="field-label">Month</label>
        <input id="sl-month" type="month" class="field-input mono" value="${o.salesMonth}" />
      </div>
      <div></div>
    </div>
    <div id="sl-body"></div>
  `;
  box.querySelector('#sl-month').addEventListener('input', e=>{ o.salesMonth = e.target.value; drawSales(); });
  drawSales();

  function drawSales(){
    const body = box.querySelector('#sl-body');
    const month = o.salesMonth;
    const today = todayStr();
    const { start, end } = monthBounds(month);
    const mtdEnd = today < end ? (today < start ? start : today) : end;
    const fmt = (n)=> n ? '$'+n.toFixed(2) : '–';

    const rows = state.customers.map(c=>{
      const mSales = computeSalesForRange(c.id, start, end);
      const mtdSales = computeSalesForRange(c.id, start, mtdEnd);
      const tSales = computeSalesForRange(c.id, today, today);
      const isCash = (c.billingType||'credit')==='cash';
      return {
        c,
        todayCash: isCash ? tSales : 0, todayCredit: isCash ? 0 : tSales,
        mtdCash: isCash ? mtdSales : 0, mtdCredit: isCash ? 0 : mtdSales,
        monthCash: isCash ? mSales : 0, monthCredit: isCash ? 0 : mSales,
        monthTotal: mSales, mtdSales, tSales,
      };
    }).filter(r=> r.monthTotal>0 || r.mtdSales>0 || r.tSales>0);

    rows.sort((a,b)=> b.monthTotal - a.monthTotal);

    const totals = rows.reduce((a,r)=>({
      todayCash:a.todayCash+r.todayCash, todayCredit:a.todayCredit+r.todayCredit,
      mtdCash:a.mtdCash+r.mtdCash, mtdCredit:a.mtdCredit+r.mtdCredit,
      monthCash:a.monthCash+r.monthCash, monthCredit:a.monthCredit+r.monthCredit,
      monthTotal:a.monthTotal+r.monthTotal,
    }), {todayCash:0,todayCredit:0,mtdCash:0,mtdCredit:0,monthCash:0,monthCredit:0,monthTotal:0});

    body.innerHTML = `
      <div class="section-label">
        <span>Sales report — ${fmtMonth(month)}</span>
        <span style="display:flex;gap:14px;">
          <button id="sl-export" class="link-btn">Export report (CSV)</button>
          <button id="sl-export-acct" class="link-btn">Export for accounting (CSV)</button>
        </span>
      </div>
      <div class="register-wrap">
        <table class="register" style="font-size:12.5px;">
          <thead>
            <tr>
              <th class="itemname" style="position:static;" rowspan="2">No.</th>
              <th style="position:static;text-align:left;" rowspan="2">Customer</th>
              <th colspan="2">Today</th>
              <th colspan="2">Month-to-date</th>
              <th colspan="3" style="border-left-width:2px;">${fmtMonth(month)}</th>
            </tr>
            <tr>
              <th>Cash</th><th>Credit</th>
              <th>Cash</th><th>Credit</th>
              <th style="border-left-width:2px;">Cash</th><th>Credit</th><th>Total</th>
            </tr>
          </thead>
          <tbody>
            ${rows.map((r,i)=>`
              <tr>
                <td class="itemname">${i+1}</td>
                <td class="itemname" style="position:static;">${esc(r.c.name)} <span class="pill ${r.c.billingType==='cash'?'open':'closed'}" style="margin-bottom:0;">${r.c.billingType==='cash'?'Cash':'Credit'}</span></td>
                <td class="mono">${fmt(r.todayCash)}</td>
                <td class="mono">${fmt(r.todayCredit)}</td>
                <td class="mono">${fmt(r.mtdCash)}</td>
                <td class="mono">${fmt(r.mtdCredit)}</td>
                <td class="mono" style="border-left-width:2px;">${fmt(r.monthCash)}</td>
                <td class="mono">${fmt(r.monthCredit)}</td>
                <td class="mono" style="font-weight:800;">${fmt(r.monthTotal)}</td>
              </tr>`).join('') || `<tr><td class="itemname" colspan="9" style="color:var(--stone-400);font-style:italic;">No deliveries confirmed in ${fmtMonth(month)} yet.</td></tr>`}
            <tr style="border-top:2px solid var(--stone-300);background:var(--stone-50);">
              <td class="itemname" colspan="2" style="font-weight:900;text-transform:uppercase;">Total</td>
              <td class="mono owed-cell2" style="border-left-width:1px;">${fmt(totals.todayCash)}</td>
              <td class="mono" style="font-weight:900;">${fmt(totals.todayCredit)}</td>
              <td class="mono" style="font-weight:900;">${fmt(totals.mtdCash)}</td>
              <td class="mono" style="font-weight:900;">${fmt(totals.mtdCredit)}</td>
              <td class="mono owed-cell2" style="font-weight:900;">${fmt(totals.monthCash)}</td>
              <td class="mono" style="font-weight:900;">${fmt(totals.monthCredit)}</td>
              <td class="mono" style="font-weight:900;color:var(--teal-800);">${fmt(totals.monthTotal)}</td>
            </tr>
          </tbody>
        </table>
      </div>
      <div class="legend">Sales = items delivered &amp; confirmed × unit price (matches the Billing tab's subtotal, before any discount or express charge). Each customer is either <b>Cash</b> (paid at delivery) or <b>Credit</b> (invoiced monthly) — set in Customers &amp; Items — so a row only ever has values in one of each Cash/Credit pair. <b>Export for accounting</b> gives Cash and Credit sales as two separate, per-customer lists for posting.</div>
    `;

    body.querySelector('#sl-export').addEventListener('click', ()=>{
      const lines = [];
      lines.push(['No.','Customer','Type','Today Cash','Today Credit','MTD Cash','MTD Credit','Month Cash','Month Credit','Month Total'].join(','));
      rows.forEach((r,i)=> lines.push([i+1, `"${r.c.name}"`, r.c.billingType==='cash'?'Cash':'Credit',
        r.todayCash.toFixed(2), r.todayCredit.toFixed(2), r.mtdCash.toFixed(2), r.mtdCredit.toFixed(2),
        r.monthCash.toFixed(2), r.monthCredit.toFixed(2), r.monthTotal.toFixed(2)].join(',')));
      lines.push(['','Total','', totals.todayCash.toFixed(2), totals.todayCredit.toFixed(2), totals.mtdCash.toFixed(2), totals.mtdCredit.toFixed(2),
        totals.monthCash.toFixed(2), totals.monthCredit.toFixed(2), totals.monthTotal.toFixed(2)].join(','));
      const blob = new Blob([lines.join('\n')], {type:'text/csv'});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = `sales_${month}.csv`;
      a.click(); URL.revokeObjectURL(url);
    });

    body.querySelector('#sl-export-acct').addEventListener('click', ()=>{
      const cashRows = rows.filter(r=> r.c.billingType==='cash' && r.monthCash>0).sort((a,b)=> b.monthCash-a.monthCash);
      const creditRows = rows.filter(r=> r.c.billingType!=='cash' && r.monthCredit>0).sort((a,b)=> b.monthCredit-a.monthCredit);
      const lines = [];
      lines.push([`Monthly sales for posting — ${fmtMonth(month)}`].join(','));
      lines.push([]);
      lines.push(['CASH SALES'].join(','));
      lines.push(['Customer','Amount'].join(','));
      cashRows.forEach(r=> lines.push([`"${r.c.name}"`, r.monthCash.toFixed(2)].join(',')));
      lines.push(['Total cash sales', totals.monthCash.toFixed(2)].join(','));
      lines.push([]);
      lines.push(['CREDIT SALES'].join(','));
      lines.push(['Customer','Amount'].join(','));
      creditRows.forEach(r=> lines.push([`"${r.c.name}"`, r.monthCredit.toFixed(2)].join(',')));
      lines.push(['Total credit sales', totals.monthCredit.toFixed(2)].join(','));
      lines.push([]);
      lines.push(['Grand total', totals.monthTotal.toFixed(2)].join(','));
      const blob = new Blob([lines.join('\n')], {type:'text/csv'});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = `accounting_sales_${month}.csv`;
      a.click(); URL.revokeObjectURL(url);
    });
  }
}

/* ---------- Admin tab ---------- */
function renderAdminTab(box){
  let localCust = JSON.parse(JSON.stringify(state.customers));
  let localPaymentDetails = state.paymentDetails;
  let dirty = false;
  let activeCustId = localCust[0]?.id || null;

  function markDirty(){
    dirty = true;
    state.hasUnsavedDraft = true;
    const btn = box.querySelector('#ad-save');
    if(btn){ btn.disabled = false; btn.textContent = 'Save changes'; }
  }

  function draw(){
    const isOwnerRole = state.currentUser && state.currentUser.role==='owner';
    box.innerHTML = `
      <div class="cust-card" style="background:var(--stone-50);">
        <div class="section-label"><span>Backup &amp; restore</span></div>
        <div style="font-size:12px;color:var(--stone-500);margin-bottom:10px;">
          <b>Automatic:</b> a full snapshot saves itself inside this app every day it's opened (last 14 days kept) — no button needed. Good protection against mistakes.<br/>
          <b>Not automatic:</b> nothing leaves this app by itself — there's no server behind it to email or upload a file while nobody's looking. If this hosted link is ever lost entirely, the daily snapshots go with it. <b>Download a copy externally (email, Drive, USB) every day</b> — you'll see a red alert at the top of Office until it's done, cleared automatically once you download.
        </div>
        <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;">
          <button id="ad-backup-download" class="btn-dark" style="background:var(--teal-700);">Download backup (.json)</button>
          <button id="ad-backup-restore-btn" class="btn-outline" style="padding:8px 14px;">Restore from file…</button>
          <input id="ad-backup-file" type="file" accept="application/json" style="display:none;" />
        </div>
        <label class="field-label">Recent automatic snapshots</label>
        <div id="ad-autobackups" style="font-size:12px;color:var(--stone-400);">Loading…</div>
      </div>

      ${isOwnerRole ? `
      <div class="cust-card" style="background:var(--rose-50);border:1px solid var(--rose-100);">
        <div class="section-label"><span style="color:var(--rose-600);">Factory reset</span></div>
        <div style="font-size:12px;color:var(--stone-600);margin-bottom:10px;">
          Permanently deletes every customer, ticket, invoice, and pending approval, and removes every Admin and Worker account — only your Owner login stays. The security key is not affected. This cannot be undone; download a backup first if there's any chance you'll want this data again.
        </div>
        <button id="ad-factory-reset" class="btn-dark" style="background:var(--rose-600);">Reset everything…</button>
      </div>` : ''}

      <div style="display:flex;justify-content:flex-end;margin-bottom:10px;">
        <button id="ad-loaddemo" class="link-btn">Load demo data (2 credit + 1 cash customer, sample tickets)</button>
      </div>

      <div class="cust-card">
        <div class="section-label"><span>Payment details</span><span style="font-weight:600;text-transform:none;letter-spacing:0;">printed on every invoice</span></div>
        <label class="field-label">Payment to (bank / account / instructions)</label>
        <textarea id="ad-paymentdetails" class="field-input" rows="3" placeholder="e.g. ABA Bank — Mekong Laundry Co., Ltd. — Account No. 000-000-000&#10;Or cash/cheque to the office">${esc(localPaymentDetails)}</textarea>
      </div>

      <div class="section-label"><span>Customers</span></div>
      <div style="display:flex;gap:8px;margin-bottom:10px;">
        <input id="ad-newcust" class="field-input" style="flex:1;" placeholder="New customer name" />
        <button id="ad-addcust" class="btn-dark" style="background:var(--teal-700);">Add</button>
      </div>
      <div id="ad-custlist" class="mb16"></div>

      <div id="ad-editor"></div>

      <button id="ad-save" class="btn-primary" ${dirty?'':'disabled'} style="width:100%;margin-top:8px;">${dirty ? (isOwnerRole?'Save changes':'Submit for approval') : (isOwnerRole?'Saved':'Nothing pending')}</button>
      ${!isOwnerRole ? `<div class="legend">As an Admin, changes here go to another Admin, then the Owner, before they take effect. See Office → Approvals.</div>` : ''}
    `;

    box.querySelector('#ad-paymentdetails').addEventListener('change', e=>{ localPaymentDetails = e.target.value; markDirty(); });

    box.querySelector('#ad-backup-download').addEventListener('click', async ()=>{
      const btn = box.querySelector('#ad-backup-download');
      btn.disabled = true; btn.textContent = 'Preparing…';
      await downloadBackup();
      btn.disabled = false; btn.textContent = 'Download backup (.json)';
    });
    const fileInput = box.querySelector('#ad-backup-file');
    box.querySelector('#ad-backup-restore-btn').addEventListener('click', ()=> fileInput.click());
    fileInput.addEventListener('change', async ()=>{
      if(fileInput.files && fileInput.files[0]) await restoreBackup(fileInput.files[0]);
      fileInput.value = '';
    });

    (async ()=>{
      const keys = await storageListKeys('autobackup:', true);
      const dates = keys.map(k=>k.replace('autobackup:','')).sort().reverse();
      const listEl = box.querySelector('#ad-autobackups');
      if(!listEl) return; // tab may have been switched away already
      if(!dates.length){ listEl.textContent = 'None yet — the first one saves next time this app is opened.'; return; }
      listEl.innerHTML = dates.map(d=>`
        <div class="item-line">
          <span>${fmtDate(d)}${d===todayStr()?' (today)':''}</span>
          <button data-restoreauto="${d}" class="link-btn">Restore this day</button>
        </div>`).join('');
      listEl.querySelectorAll('[data-restoreauto]').forEach(b=> b.addEventListener('click', ()=> restoreFromAutoBackup(b.dataset.restoreauto)));
    })();

    const resetBtn = box.querySelector('#ad-factory-reset');
    if(resetBtn) resetBtn.addEventListener('click', async ()=>{
      const first = confirm('This permanently deletes ALL customers, tickets, invoices, pending approvals, and every Admin/Worker account. Only your Owner login survives. This CANNOT be undone.\n\nContinue?');
      if(!first) return;
      const typed = prompt('Type RESET (all capitals) to confirm permanent deletion of all data:');
      if(typed !== 'RESET'){ showToast('Reset cancelled — text did not match'); return; }
      resetBtn.disabled = true; resetBtn.textContent = 'Resetting…';
      await factoryReset();
      showToast('Factory reset complete');
    });

    box.querySelector('#ad-loaddemo').addEventListener('click', async ()=>{
      if(!confirm('Add 2 credit customers and 1 cash customer (if not already present) with sample pickup/delivery tickets, including Short/Over examples? This only adds — it will not remove or change your existing data.')) return;
      await seedDemoData();
      localCust = JSON.parse(JSON.stringify(state.customers));
      showToast('Demo data loaded');
      draw();
    });

    const custList = box.querySelector('#ad-custlist');
    custList.innerHTML = localCust.map(c=>`
      <div class="item-line" style="${c.id===activeCustId?'background:var(--teal-50);':''}">
        <button data-editcust="${c.id}" style="background:none;font-weight:800;text-align:left;flex:1;display:flex;align-items:center;gap:8px;color:${c.id===activeCustId?'var(--teal-800)':'var(--stone-900)'};">
          ${esc(c.name)}
          <span class="pill ${c.billingType==='cash'?'open':'closed'}" style="margin-bottom:0;">${c.billingType==='cash'?'Cash':'Credit'}</span>
        </button>
        <button data-removecust="${c.id}" style="background:none;color:var(--rose-600);font-weight:800;font-size:14px;">×</button>
      </div>`).join('') || `<div style="font-size:12px;color:var(--stone-400);font-style:italic;">No customers yet.</div>`;

    box.querySelector('#ad-addcust').addEventListener('click', ()=>{
      const inp = box.querySelector('#ad-newcust');
      if(!inp.value.trim()) return;
      const nc = buildDefaultCustomer(uid(), inp.value.trim());
      localCust.push(nc);
      activeCustId = nc.id;
      markDirty(); draw();
    });
    custList.querySelectorAll('[data-editcust]').forEach(b=> b.addEventListener('click', ()=>{ activeCustId = b.dataset.editcust; draw(); }));
    custList.querySelectorAll('[data-removecust]').forEach(b=> b.addEventListener('click', ()=>{
      if(!confirm('Remove this customer? Existing tickets stay in storage but the customer will no longer show in dropdowns.')) return;
      localCust = localCust.filter(c=>c.id!==b.dataset.removecust);
      if(activeCustId===b.dataset.removecust) activeCustId = localCust[0]?.id || null;
      markDirty(); draw();
    }));

    const editorBox = box.querySelector('#ad-editor');
    const cust = localCust.find(c=>c.id===activeCustId);
    if(!cust){ editorBox.innerHTML = ''; }
    else drawCustomerEditor(editorBox, cust);

    box.querySelector('#ad-save').addEventListener('click', async ()=>{
      const role = state.currentUser ? state.currentUser.role : 'worker';
      if(role === 'owner'){
        await saveCustomers(localCust);
        state.paymentDetails = localPaymentDetails;
        await storageSet('paymentDetails', localPaymentDetails, true);
        dirty=false; state.hasUnsavedDraft = false; draw(); showToast('Saved');
      } else {
        // Admins can't publish item/price changes directly — this goes into the
        // approval queue: another Admin approves, then the Owner gives final approval.
        const change = {
          id: uid(),
          proposedBy: currentUserName(),
          proposedAt: new Date().toISOString(),
          customersSnapshot: localCust,
          paymentDetailsSnapshot: localPaymentDetails,
          status: 'pending_admin_approval',
          adminApprovedBy: null, adminApprovedAt: null,
          ownerApprovedBy: null, ownerApprovedAt: null,
        };
        await savePendingChanges([...state.pendingChanges, change]);
        dirty=false; state.hasUnsavedDraft = false; draw();
        showToast('Submitted for approval — needs another Admin, then the Owner');
      }
    });
  }

  function drawCustomerEditor(editorBox, cust){
    // ensure exactly 5 section slots
    while(cust.sections.length < 5) cust.sections.push(`Section ${cust.sections.length+1}`);
    if(!cust.billingType) cust.billingType = 'credit';

    editorBox.innerHTML = `
      <div class="cust-card">
        <div class="section-label"><span>Customer details</span></div>
        <div class="row2">
          <div>
            <label class="field-label">Billing type</label>
            <select id="ad-billingtype" class="field-input">
              <option value="credit" ${cust.billingType==='credit'?'selected':''}>Credit — billed monthly</option>
              <option value="cash" ${cust.billingType==='cash'?'selected':''}>Cash — paid at delivery</option>
            </select>
          </div>
          <div>
            <label class="field-label">Contact person</label>
            <input type="text" id="ad-contact" class="field-input" value="${esc(cust.contactName||'')}" />
          </div>
        </div>
        <div class="row2" style="margin-bottom:0;">
          <div>
            <label class="field-label">Phone</label>
            <input type="text" id="ad-phone" class="field-input" value="${esc(cust.phone||'')}" />
          </div>
          <div>
            <label class="field-label">Address</label>
            <input type="text" id="ad-address" class="field-input" value="${esc(cust.address||'')}" />
          </div>
        </div>
        ${cust.billingType==='cash' ? '' : `
        <div class="row2" style="margin-bottom:0;margin-top:10px;">
          <div>
            <label class="field-label">Payment terms (days until due)</label>
            <input type="number" id="ad-terms" class="field-input mono" style="max-width:120px;" min="0" value="${cust.paymentTermsDays==null?30:cust.paymentTermsDays}" />
          </div>
          <div></div>
        </div>`}
      </div>

      <div class="section-label" style="margin-top:8px;"><span>Editing: ${esc(cust.name)}</span><span style="font-weight:600;text-transform:none;letter-spacing:0;">5 sections · ★ = frequent (moves up) · 👁 = hidden from the field form</span></div>
      <div id="ad-sections"></div>
    `;

    editorBox.querySelector('#ad-billingtype').addEventListener('change', e=>{ cust.billingType = e.target.value; markDirty(); drawCustomerEditor(editorBox, cust); });
    editorBox.querySelector('#ad-contact').addEventListener('change', e=>{ cust.contactName = e.target.value.trim(); markDirty(); });
    editorBox.querySelector('#ad-phone').addEventListener('change', e=>{ cust.phone = e.target.value.trim(); markDirty(); });
    editorBox.querySelector('#ad-address').addEventListener('change', e=>{ cust.address = e.target.value.trim(); markDirty(); });
    const termsInput = editorBox.querySelector('#ad-terms');
    if(termsInput) termsInput.addEventListener('change', e=>{ cust.paymentTermsDays = Math.max(0, parseInt(e.target.value||'30',10)); markDirty(); });

    const secBox = editorBox.querySelector('#ad-sections');
    secBox.innerHTML = cust.sections.map((sec, sidx)=>{
      const items = cust.items.filter(it=>it.category===sec);
      return `
      <div class="cust-card">
        <input type="text" class="field-input" style="font-weight:800;margin-bottom:8px;" data-sectionname="${sidx}" value="${esc(sec)}" />
        <div data-sectionitems="${sidx}">
          ${items.length ? items.map(it=>`
            <div class="item-line">
              <span style="flex:1;display:flex;align-items:center;gap:6px;">
                <button data-toggle-freq="${it.id}" title="Mark as frequently used" style="background:none;font-size:15px;color:${it.frequent?'var(--amber-700)':'var(--stone-300)'};">★</button>
                <button data-toggle-hidden="${it.id}" title="Hide from the field form" style="background:none;font-size:14px;color:${it.hidden?'var(--rose-600)':'var(--stone-300)'};">👁</button>
                <span style="${it.hidden?'color:var(--stone-400);font-style:italic;':''}">${esc(it.name)}</span>
                <span class="mono" style="color:var(--stone-400);font-size:11px;">$${Number(it.price||0).toFixed(2)}</span>
              </span>
              <button data-removeitem="${it.id}" style="background:none;color:var(--rose-600);font-weight:800;font-size:14px;">×</button>
            </div>`).join('') : `<div style="font-size:12px;color:var(--stone-400);font-style:italic;margin-bottom:6px;">No items in this section yet.</div>`}
        </div>
        <div class="additem-row">
          <input type="text" placeholder="Item name" data-itemname="${sidx}" />
          <input type="number" step="0.01" inputmode="decimal" placeholder="$" data-itemprice="${sidx}" />
          <button data-additem="${sidx}">+</button>
        </div>
      </div>`;
    }).join('');

    secBox.querySelectorAll('[data-sectionname]').forEach(inp=> inp.addEventListener('input', ()=>{
      const sidx = parseInt(inp.dataset.sectionname,10);
      const oldName = cust.sections[sidx];
      const newName = inp.value.trim() || `Section ${sidx+1}`;
      if(oldName===newName) return;
      cust.items.forEach(it=>{ if(it.category===oldName) it.category = newName; });
      cust.sections[sidx] = newName;
      markDirty();
      // re-key the items container's data attribute without a full redraw, so focus isn't lost
      const itemsContainer = secBox.querySelector(`[data-sectionitems="${sidx}"]`);
      if(itemsContainer) itemsContainer.dataset.sectionitems = sidx;
    }));

    secBox.querySelectorAll('[data-toggle-freq]').forEach(b=> b.addEventListener('click', ()=>{
      const it = cust.items.find(x=>x.id===b.dataset.toggleFreq);
      it.frequent = !it.frequent;
      markDirty(); drawCustomerEditor(editorBox, cust);
    }));
    secBox.querySelectorAll('[data-toggle-hidden]').forEach(b=> b.addEventListener('click', ()=>{
      const it = cust.items.find(x=>x.id===b.dataset.toggleHidden);
      it.hidden = !it.hidden;
      markDirty(); drawCustomerEditor(editorBox, cust);
    }));
    secBox.querySelectorAll('[data-removeitem]').forEach(b=> b.addEventListener('click', ()=>{
      cust.items = cust.items.filter(it=>it.id!==b.dataset.removeitem);
      markDirty(); drawCustomerEditor(editorBox, cust);
    }));
    secBox.querySelectorAll('[data-additem]').forEach(b=> b.addEventListener('click', ()=>{
      const sidx = parseInt(b.dataset.additem,10);
      const nameInp = secBox.querySelector(`[data-itemname="${sidx}"]`);
      const priceInp = secBox.querySelector(`[data-itemprice="${sidx}"]`);
      const name = nameInp.value.trim();
      if(!name) return;
      cust.items.push({ id: uid(), name, category: cust.sections[sidx], price: parseFloat(priceInp.value)||0, frequent:false, hidden:false });
      markDirty(); drawCustomerEditor(editorBox, cust);
    }));
  }

  draw();
}

init();
</script>
