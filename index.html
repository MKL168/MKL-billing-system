<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MKL Billing System — Pickup &amp; Delivery</title>
<style>

  *{box-sizing:border-box;}

  .brand-badge{width:34px;height:34px;border-radius:50%;background:var(--teal-50);color:var(--teal-800);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:13px;flex:none;}

  .btn-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;}

  canvas.sigpad{width:100%;height:110px;background:#fff;border-radius:10px;border:2px dashed var(--stone-300);touch-action:none;display:block;}

  .office-tabs{display:flex;gap:4px;background:var(--stone-100);border-radius:10px;padding:4px;margin-bottom:16px;}
  .office-tabs button{flex:1;padding:8px 0;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.03em;border-radius:8px;background:none;color:var(--stone-500);}
  .office-tabs button.active{background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.1);color:var(--teal-800);}
  .card{border-radius:14px;border:1px solid var(--stone-200);background:#fff;padding:12px;margin-bottom:10px;}
  .card.unreviewed{border-color:#99d8d4;box-shadow:0 0 0 1px var(--teal-100);}
  .pill{display:inline-block;font-size:10px;font-weight:900;text-transform:uppercase;letter-spacing:.04em;padding:2px 9px;border-radius:999px;margin-bottom:5px;}

  .flag-short{color:var(--amber-700);font-weight:800;font-size:12px;margin-top:4px;}
  .sig-thumb{height:40px;margin-top:4px;border:1px solid var(--stone-100);border-radius:6px;background:#fff;}
  .reviewed-row{margin-top:8px;font-size:12px;font-weight:700;color:var(--stone-500);display:flex;align-items:center;gap:6px;}
  table.grid{border-collapse:collapse;width:100%;font-size:12.5px;background:#fff;}
  table.grid th, table.grid td{padding:6px 7px;border-bottom:1px solid var(--stone-100);border-left:1px solid var(--stone-100);text-align:center;}

  table.grid td.itemname, table.grid th.itemname{text-align:left;font-weight:700;border-left:none;white-space:nowrap;}
  table.grid td.rowno{color:var(--stone-400);font-weight:700;border-left:none;width:24px;}
  table.grid tr.cat-row td{background:var(--teal-800);color:#fff;font-weight:800;text-transform:uppercase;letter-spacing:.05em;font-size:10.5px;text-align:left;border-left:none;padding:5px 8px;}

  table.grid input[type=number]:focus{outline:2px solid var(--teal-700);outline-offset:0;border-color:var(--teal-700);}
  table.grid input[type=text]{width:100%;min-width:110px;border:1px solid var(--stone-200);border-radius:7px;padding:4px 6px;font-size:12px;}
  td.short-cell{font-weight:800;color:var(--amber-700);}
  td.over-cell{font-weight:800;color:var(--rose-600);}
  td.readonly-cell{font-weight:800;background:var(--stone-50);user-select:none;-webkit-user-select:none;cursor:default;}
  td.short-cell, td.over-cell{user-select:none;-webkit-user-select:none;cursor:default;}
  .grid-wrap{overflow-x:auto;border:1px solid var(--stone-200);border-radius:14px;margin-bottom:8px;}
  .legend{font-size:11px;color:var(--stone-400);margin-top:6px;margin-bottom:20px;}
  table.register{border-collapse:collapse;width:100%;font-size:12px;}
  table.register th, table.register td{padding:5px 6px;border-left:1px solid var(--stone-100);text-align:center;}
  table.register thead tr:first-child th{background:var(--stone-100);font-weight:800;color:var(--stone-500);text-transform:uppercase;letter-spacing:.03em;}
  table.register thead tr:nth-child(2) th{background:var(--stone-50);font-size:9px;color:var(--stone-400);}
  table.register td.itemname, table.register th.itemname{position:sticky;left:0;background:#fff;text-align:left;font-weight:700;white-space:nowrap;border-left:none;}
  table.register thead th.itemname{background:var(--stone-100);border-left:none;}
  .register-wrap{overflow-x:auto;border:1px solid var(--stone-200);border-radius:14px;}
  .owed-cell2{font-weight:800;border-left:2px solid var(--stone-300)!important;}
  .owed-pos{color:var(--amber-700);background:var(--amber-50);}
  .owed-neg{color:var(--rose-600);background:var(--rose-50);}
  .cust-card{border:1px solid var(--stone-200);border-radius:14px;background:#fff;padding:12px;margin-bottom:10px;}
  .item-line{display:flex;align-items:center;justify-content:space-between;font-size:13px;background:var(--stone-50);border-radius:6px;padding:5px 8px;margin-bottom:4px;}
  .additem-row{display:grid;grid-template-columns:1fr 70px 34px;gap:6px;margin-top:6px;}
  .additem-row input{border:1px solid var(--stone-200);border-radius:6px;padding:5px 8px;font-size:13px;}
  .additem-row button{background:var(--teal-100);color:var(--teal-800);font-weight:800;padding:0 10px;border-radius:6px;}
  select.field-input{appearance:auto;}
  .link-btn{background:none;color:var(--teal-700);font-weight:800;font-size:11px;text-transform:uppercase;letter-spacing:.03em;}
  .empty-note{font-size:13px;color:var(--stone-400);font-style:italic;text-align:center;padding:40px 0;}

  /* ---- print ---- */
  #print-area{display:none;}
  @media print{
    .screen-ui{display:none !important;}
    #print-area{display:block !important;}
    body{background:#fff;}
  }
  .pt-header{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:3px solid #000;padding-bottom:10px;margin-bottom:14px;}
  .pt-title{font-size:20px;font-weight:900;letter-spacing:-.02em;}
  .pt-sub{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:#555;}
  .pt-ticketno{font-size:15px;font-weight:900;color:#b91c1c;}
  .pt-meta{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:14px;font-size:13px;}
  .pt-meta div b{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:#666;font-weight:700;}
  table.pt-table{width:100%;border-collapse:collapse;font-size:11px;margin-bottom:10px;}
  table.pt-table th, table.pt-table td{border:1px solid #999;padding:3px 5px;text-align:center;}
  table.pt-table th{background:#eee;font-weight:800;text-transform:uppercase;font-size:9px;}
  table.pt-table td.pt-name{text-align:left;font-weight:700;}
  table.pt-table tr.pt-cat td{background:#ddd;font-weight:800;text-align:left;text-transform:uppercase;font-size:9.5px;}
  .pt-sign-block{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:22px;}

  .pt-sign-img{height:48px;margin-bottom:2px;}
  .pt-sign-line{border-top:1px solid #000;margin-top:36px;padding-top:4px;font-size:9.5px;text-transform:uppercase;letter-spacing:.04em;}
  .pt-sign-sub{font-size:9px;color:#555;}
</style>

<body>
<div id="app" class="app screen-ui"></div>
<div id="print-area"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
/* If the SheetJS CDN can't load (offline / blocked), Excel export below
   falls back to CSV automatically — see exportInvoicesExcel(). *//* ================================================================
   MKL BILLING SYSTEM — Pickup & Delivery ticket system + Office review
   Standalone HTML + vanilla JS. No build step, no dependencies.

   Matches the paper "Laundry Pick Up & Delivery" ticket:
   - Each pickup opens a numbered TICKET with Pickup qty per item.
   - When that batch is ready, the SAME ticket is completed with
     Delivery qty. Short/Over = Pickup − Delivery for that ticket.
   - 4 signatures: Collected By / Pick Up By (at pickup),
     Delivery By / Received By (at delivery).
   - Ticket is printable at any stage.

   Persistence: this browser's own localStorage. Fully self-contained —
   works the moment this file is opened, no server or account setup needed.
   Trade-off: data stays on this one device/browser, it does not sync
   between different phones/computers.
   ================================================================ */

const todayStr = () => new Date().toISOString().slice(0,10);
const uid = () => Math.random().toString(36).slice(2,10) + Date.now().toString(36).slice(-4);
const fmtDate = (d) => { if(!d) return '—'; const dt = new Date(d+'T00:00:00'); return dt.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}); };
const esc = (s) => String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const padTicket = (n) => String(n).padStart(6,'0');
function addYears(date, n){ const d = new Date(date); d.setFullYear(d.getFullYear()+n); return d; }
function generateSecurityKey(){
  const chunk = () => Math.random().toString(36).slice(2,6).toUpperCase();
  return `MKL-${chunk()}-${chunk()}-${chunk()}`;
}

const DEFAULT_SECTIONS = ['Bedroom Linen', 'Bathroom Linen', 'F&B', 'Uniform', 'Others'];
const DEFAULT_ITEMS_BY_SECTION = {
  'Bedroom Linen': [['Bed Sheet King',0.35],['Bed Sheet Twin',0.35],['Duvet Cover King',0.45],['Duvet Cover Twin',0.45],
    ['Pillow Case',0.15],['Blanket',0],['Duvet Inset',2.5],['Pillow',2.5],['Bed Runner',0.15],['Mattress Protector',0.7],['Curtain',6]],
  'Bathroom Linen': [['Bath Towel',0.25],['Bath Mat',0.15],['Hand Towel',0.15],['Face Towel',0.12],['Bath Robe',0.7],['Shower Curtain',0]],
  'F&B': [['Chair Cover',0],['Decoration Cloth',0],['Napkin',0],['Table Cloth Square',0],['Table Cloth Round',0],['Cleaning Cloth',0],['Apron',0]],
  'Uniform': [['Shirt',0],['Trouser',0],['Vest',0],['Skirt',0],['Short',0],['Jacket',0],['Handkerchief',0],['Cap/Hat',0]],
  'Others': [],
};
function buildDefaultItems(){
  const out = [];
  DEFAULT_SECTIONS.forEach(sec=>{
    (DEFAULT_ITEMS_BY_SECTION[sec]||[]).forEach(([name,price])=>{
      out.push({ id: uid(), name, category: sec, price: price||0, frequent:false, hidden:false });
    });
  });
  return out;
}
function buildDefaultCustomer(id, name){
  return {
    id, name, sections: [...DEFAULT_SECTIONS], items: buildDefaultItems(),
    billingType: 'credit', contactName:'', phone:'', address:'', notes:'',
    paymentTermsDays: 30,
  };
}
const DEFAULT_CUSTOMERS = [
  buildDefaultCustomer('aquarius', 'Aquarius Hotel'),
  buildDefaultCustomer('rosewood', 'Rosewood Phnom Penh'),
  { ...buildDefaultCustomer('kravan', 'Kravan Guesthouse'), billingType: 'cash' },
];

/* ---------------- storage ---------------- */
/* Standalone build: everything lives in this browser's own localStorage.
   No server, no functions, no external accounts — works the moment this
   single file is opened, including straight from GitHub Pages. The one
   real trade-off: data stays on THIS device/browser only. It will not
   sync between different phones/computers — each one keeps its own copy.
   If you outgrow that, the app can be pointed at a real shared backend
   (Firebase, or the Netlify Functions version) without changing anything
   above this point in the file. */
async function storageGet(key, shared){
  try{ const v = localStorage.getItem('mkl:'+key); return v!=null ? JSON.parse(v) : null; }catch(e){ return null; }
}
async function storageSet(key, value, shared){
  try{ localStorage.setItem('mkl:'+key, JSON.stringify(value)); return true; }catch(e){ return false; }
}
async function storageListKeys(prefix, shared){
  try{
    const keys = [];
    const p = 'mkl:'+(prefix||'');
    for(let i=0;i<localStorage.length;i++){
      const k = localStorage.key(i);
      if(k && k.indexOf(p)===0) keys.push(k.slice(4));
    }
    return keys;
  }catch(e){ return []; }
}
async function storageDelete(key, shared){
  try{ localStorage.removeItem('mkl:'+key); return true; }catch(e){ return false; }
}

/* ---------------- global state ---------------- */
const state = {
  ready:false,
  customers: DEFAULT_CUSTOMERS,
  tickets: {},        // custId -> [ticket,...]
  ticketCounter: 0,
  view: 'visit',       // visit | office
  visitMode: 'new',    // new | deliver (within the one Pickup & Delivery form)
  pickupForm: null,
  deliverForm: null,
  office: { tab:'tickets', statusFilter:'open', custFilter:'all', registerCust:null, registerMonth: todayStr().slice(0,7), billingCust:null, billingMonth: todayStr().slice(0,7), billingDate: todayStr(), billingView:'list', billingFilterCust:'all', billingFilterType:'all', billingFilterFrom:'', billingFilterTo:'', salesMonth: todayStr().slice(0,7) },
  revealedHidden: {},  // sectionName -> bool, ephemeral UI state for "show hidden items"
  billingCache: {},    // "custId:month" -> {discount, discountNote, express, expressNote}
  invoiceNumbers: {},  // "custId:period" -> sequential invoice number (stable once assigned)
  invoiceCounter: 0,
  paymentDetails: '',  // global "pay to" instructions shown on printed invoices
  users: [],           // {id, name, role:'owner'|'admin'|'worker', pin, active}
  currentUser: null,   // the account this device is logged in as
  loginPinFor: null,   // id of the user currently entering a PIN on the login screen
  pendingChanges: [],  // Customers & Items edits awaiting Admin + Owner approval
  securityKey: null,   // {key, setBy, setAt, expiresAt} — whole-app access key, renews yearly
  lastManualBackupAt: null, // ISO timestamp of the last "Download backup" click — for the daily reminder
  toastTimer: null,
  hasUnsavedDraft: false, // true while Users/Customers & Items has unsaved local edits — background refresh must not wipe them
};

const DEFAULT_USERS = [
  { id:'owner1', name:'Owner', role:'owner', pin:'1234', active:true },
];


function currentUserName(){ return state.currentUser ? state.currentUser.name : 'Unnamed'; }
function freshPickupForm(){
  return { custId: state.customers[0]?.id || '', date: todayStr(), worker: currentUserName(), qtys:{}, remarks:{}, collectedBy:null, pickUpBy:null };
}
function freshDeliverForm(){
  return { ticketId:null, date: todayStr(), worker: currentUserName(), delivered:{}, remarks:{}, deliveryBy:null, receivedBy:null };
}

function ticketsFor(custId){ return state.tickets[custId] || []; }
function allOpenTickets(){
  const out = [];
  state.customers.forEach(c=> ticketsFor(c.id).filter(t=>t.status==='open').forEach(t=> out.push({...t, custName:c.name})));
  out.sort((a,b)=> a.date < b.date ? -1 : a.date > b.date ? 1 : 0);
  return out;
}
// Simple grouping by first-seen category order — used for TICKET items (already fixed at creation time).
function groupByCategory(items){
  const order = []; const map = {};
  items.forEach(it=>{ const cat = it.category || 'Other'; if(!map[cat]){ map[cat]=[]; order.push(cat); } map[cat].push(it); });
  return order.map(cat=>({cat, items:map[cat]}));
}
// Section-ordered grouping for a customer's live, editable catalog: fixed section order,
// frequent items bubble to the top of their section, hidden items excluded unless revealed.
function sectionGroupsForCustomer(customer, {includeHidden=true, sortFrequent=true, skipEmpty=false}={}){
  const sections = customer.sections && customer.sections.length ? customer.sections : DEFAULT_SECTIONS;
  return sections.map(sec=>{
    let items = customer.items.filter(it=> (it.category||'Others')===sec);
    const visible = items.filter(it=> includeHidden || !it.hidden);
    const hidden = items.filter(it=> it.hidden);
    const sortFn = (a,b)=> (b.frequent?1:0)-(a.frequent?1:0);
    return {
      cat: sec,
      items: sortFrequent ? [...visible].sort(sortFn) : visible,
      hiddenItems: sortFrequent ? [...hidden].sort(sortFn) : hidden,
    };
  }).filter(g=> !skipEmpty || g.items.length>0 || g.hiddenItems.length>0);
}

async function saveCustomers(next){ state.customers = next; await storageSet('customers', next, true); }
async function saveUsers(next){
  state.users = next;
  await storageSet('users', next, true);
  // keep the live session in sync if the logged-in user's own record changed (e.g. PIN)
  if(state.currentUser){
    const me = next.find(u=>u.id===state.currentUser.id);
    if(me) state.currentUser = me;
  }
}
async function savePendingChanges(next){ state.pendingChanges = next; await storageSet('pendingChanges', next, true); }
async function renewSecurityKey(customKey){
  const next = {
    key: (customKey && customKey.trim()) || generateSecurityKey(),
    setBy: currentUserName(),
    setAt: new Date().toISOString(),
    expiresAt: addYears(new Date(), 1).toISOString(),
  };
  state.securityKey = next;
  await storageSet('securityKey', next, true);
  return next;
}
async function saveTicketCounter(next){ state.ticketCounter = next; await storageSet('ticketCounter', next, true); }
async function saveTickets(custId, next){
  state.tickets[custId] = next;
  await storageSet('tickets:'+custId, next, true);
}
async function addTicket(custId, ticket){
  const cur = ticketsFor(custId);
  await saveTickets(custId, [...cur, ticket]);
}
async function updateTicket(custId, ticketId, patch){
  const cur = ticketsFor(custId);
  const next = cur.map(t=> t.id===ticketId ? {...t, ...patch} : t);
  await saveTickets(custId, next);
}

function showToast(msg){
  let t = document.getElementById('toast');
  if(t) t.remove();
  t = document.createElement('div');
  t.id='toast'; t.className='toast'; t.textContent = msg;
  document.body.appendChild(t);
  clearTimeout(state.toastTimer);
  state.toastTimer = setTimeout(()=> t.remove(), 2200);
}

/* ---------------- init ---------------- */
async function init(){
  let c = await storageGet('customers', true);
  const isBrandNewStore = !c;
  if(!c){ c = DEFAULT_CUSTOMERS; await storageSet('customers', c, true); }
  // migrate any older/incomplete customer records to the new shape
  let migrated = false;
  c = c.map(cust=>{
    let next = cust;
    if(!cust.sections || !cust.items){
      migrated = true;
      next = { ...next, sections: cust.sections || [...DEFAULT_SECTIONS], items: cust.items || buildDefaultItems() };
    }
    if(!next.billingType){
      migrated = true;
      next = { ...next, billingType: 'credit', contactName: next.contactName||'', phone: next.phone||'', address: next.address||'', notes: next.notes||'' };
    }
    if(next.paymentTermsDays==null){
      migrated = true;
      next = { ...next, paymentTermsDays: 30 };
    }
    return next;
  });
  if(migrated) await storageSet('customers', c, true);
  state.customers = c;

  let counter = await storageGet('ticketCounter', true);
  if(counter==null){ counter = 0; await storageSet('ticketCounter', counter, true); }
  state.ticketCounter = counter;

  state.invoiceNumbers = (await storageGet('invoiceNumbers', true)) || {};
  state.invoiceCounter = (await storageGet('invoiceCounter', true)) || 0;
  state.paymentDetails = (await storageGet('paymentDetails', true)) || '';

  let users = await storageGet('users', true);
  if(!users || !users.length){ users = DEFAULT_USERS; await storageSet('users', users, true); }
  state.users = users;
  state.pendingChanges = (await storageGet('pendingChanges', true)) || [];

  let secKey = await storageGet('securityKey', true);
  if(!secKey){
    secKey = { key: generateSecurityKey(), setBy:'System', setAt: new Date().toISOString(), expiresAt: addYears(new Date(), 1).toISOString() };
    await storageSet('securityKey', secKey, true);
  }
  state.securityKey = secKey;

  state.lastManualBackupAt = await storageGet('lastManualBackupAt', true);

  // "who is this device logged in as" is PERSONAL storage (shared:false) —
  // each phone/computer stays logged in as its own worker, not shared with others.
  const curId = await storageGet('currentUserId', false);
  if(curId){
    const found = state.users.find(u=> u.id===curId && u.active!==false);
    if(found) state.currentUser = found;
  }

  for(const cust of c){
    const t = await storageGet('tickets:'+cust.id, true);
    state.tickets[cust.id] = t || [];
  }

  state.pickupForm = freshPickupForm();
  state.deliverForm = freshDeliverForm();
  state.office.registerCust = c[0]?.id || null;
  state.office.billingCust = c[0]?.id || null;

  // only auto-seed demo data on a genuinely brand-new store — never after an
  // intentional factory reset, which leaves customers as an explicit empty array
  if(isBrandNewStore){ await seedDemoData(); }

  state.ready = true;
  render();

  // fire in the background — don't hold up the UI while this runs
  runAutoBackupIfNeeded();
  startPolling();
}

/* ---------------- live sync across devices ---------------- */
/* Every device polls the shared data every ~12s, and immediately whenever
   the tab regains focus, so a PIN change, a new ticket, or an approval on
   one device shows up on every other device without anyone refreshing.
   Skips the re-render (but still updates the underlying data) if the person
   is actively typing, so nobody's half-finished entry gets yanked away. */
let pollTimer = null;
function startPolling(){
  if(pollTimer) return;
  pollTimer = setInterval(refreshSharedData, 12000);
  document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) refreshSharedData(); });
  window.addEventListener('focus', refreshSharedData);
}

async function refreshSharedData(){
  if(!state.ready || !state.currentUser) return;
  try{
    const [users, customers, pendingChanges, securityKey, paymentDetails, invoiceNumbers, invoiceCounter, ticketCounter, lastManualBackupAt] = await Promise.all([
      storageGet('users', true),
      storageGet('customers', true),
      storageGet('pendingChanges', true),
      storageGet('securityKey', true),
      storageGet('paymentDetails', true),
      storageGet('invoiceNumbers', true),
      storageGet('invoiceCounter', true),
      storageGet('ticketCounter', true),
      storageGet('lastManualBackupAt', true),
    ]);
    const custList = customers || state.customers;
    const ticketsByCust = {};
    for(const c of custList){ ticketsByCust[c.id] = (await storageGet('tickets:'+c.id, true)) || []; }

    const snapshot = JSON.stringify({ users, customers, pendingChanges, securityKey, paymentDetails, invoiceNumbers, invoiceCounter, ticketCounter, lastManualBackupAt, ticketsByCust });
    if(snapshot === state._lastPollSnapshot) return; // nothing changed anywhere — skip re-render entirely
    state._lastPollSnapshot = snapshot;

    if(users) state.users = users;
    if(customers) state.customers = customers;
    if(pendingChanges) state.pendingChanges = pendingChanges;
    if(securityKey) state.securityKey = securityKey;
    if(paymentDetails!=null) state.paymentDetails = paymentDetails;
    if(invoiceNumbers) state.invoiceNumbers = invoiceNumbers;
    if(invoiceCounter!=null) state.invoiceCounter = invoiceCounter;
    if(ticketCounter!=null) state.ticketCounter = ticketCounter;
    if(lastManualBackupAt!=null) state.lastManualBackupAt = lastManualBackupAt;
    state.tickets = ticketsByCust;

    if(state.currentUser){
      const me = state.users.find(u=>u.id===state.currentUser.id);
      if(me) state.currentUser = me;
      else { await logoutUser(); return; } // this account was removed elsewhere — log out
    }

    const active = document.activeElement;
    const appEl = document.getElementById('app');
    const isTyping = active && ['INPUT','TEXTAREA','SELECT'].includes(active.tagName) && appEl && appEl.contains(active);
    if(!isTyping && !state.hasUnsavedDraft) render();
  }catch(e){ /* transient network hiccup — next poll will catch up */ }
}

/* ---------------- full backup / restore ---------------- */
async function buildBackup(){
  const ticketsByCustomer = {};
  state.customers.forEach(c=>{ ticketsByCustomer[c.id] = ticketsFor(c.id); });

  const billingKeys = await storageListKeys('billing:', true);
  const billingAdjustments = {};
  for(const k of billingKeys){
    const val = await storageGet(k, true);
    if(val) billingAdjustments[k.replace(/^billing:/,'')] = val;
  }

  return {
    version: 1,
    exportedAt: new Date().toISOString(),
    customers: state.customers,
    ticketsByCustomer,
    ticketCounter: state.ticketCounter,
    invoiceNumbers: state.invoiceNumbers,
    invoiceCounter: state.invoiceCounter,
    paymentDetails: state.paymentDetails,
    billingAdjustments,
    users: state.users,
    pendingChanges: state.pendingChanges,
  };
}

async function downloadBackup(){
  const data = await buildBackup();
  const blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `mekong_laundry_backup_${todayStr()}.json`;
  a.click(); URL.revokeObjectURL(url);
  const now = new Date().toISOString();
  state.lastManualBackupAt = now;
  await storageSet('lastManualBackupAt', now, true);
}

async function restoreBackupData(data, confirmMsg){
  if(!data || !Array.isArray(data.customers)){
    showToast("This doesn't look like a Mekong Laundry backup");
    return false;
  }
  if(!confirm(confirmMsg)) return false;

  await storageSet('customers', data.customers, true);
  for(const custId in (data.ticketsByCustomer||{})){
    await storageSet('tickets:'+custId, data.ticketsByCustomer[custId], true);
  }
  if(data.ticketCounter!=null) await storageSet('ticketCounter', data.ticketCounter, true);
  if(data.invoiceNumbers) await storageSet('invoiceNumbers', data.invoiceNumbers, true);
  if(data.invoiceCounter!=null) await storageSet('invoiceCounter', data.invoiceCounter, true);
  if(data.paymentDetails!=null) await storageSet('paymentDetails', data.paymentDetails, true);
  for(const key in (data.billingAdjustments||{})){
    await storageSet('billing:'+key, data.billingAdjustments[key], true);
  }
  if(Array.isArray(data.users) && data.users.length) await storageSet('users', data.users, true);
  if(Array.isArray(data.pendingChanges)) await storageSet('pendingChanges', data.pendingChanges, true);

  // clear in-memory caches so the reload below reads the restored data, not stale copies
  state.billingCache = {};
  state.tickets = {};
  state.ready = false;
  render();
  await init();
  showToast('Backup restored');
  return true;
}

async function restoreBackup(file){
  let data;
  try{
    data = JSON.parse(await file.text());
  }catch(e){
    showToast('That file is not valid — could not read it as a backup');
    return;
  }
  const summary = data && Array.isArray(data.customers)
    ? `${data.customers.length} customer(s), exported ${data.exportedAt ? fmtDate(data.exportedAt.slice(0,10)) : 'unknown date'}`
    : '';
  await restoreBackupData(data, `Restore this backup?\n\n${summary}\n\nThis will REPLACE all current customers, tickets, invoices, and settings on this link. This cannot be undone.`);
}

async function restoreFromAutoBackup(dateStr){
  const data = await storageGet('autobackup:'+dateStr, true);
  if(!data){ showToast('That automatic backup is no longer available'); return; }
  await restoreBackupData(data, `Restore the automatic backup from ${fmtDate(dateStr)}?\n\nThis will REPLACE all current customers, tickets, invoices, and settings on this link with how things looked on that day. This cannot be undone.`);
}

async function dismissBackupAlertToday(){

}

/* Owner-only: permanently wipes all business data and every Admin/Worker
   account, keeping only the Owner performing the reset. Does NOT touch the
   security key. Requires two separate confirmations before it runs. */
async function factoryReset(){
  const ownerUser = state.currentUser;
  if(!ownerUser || ownerUser.role!=='owner') return;

  const oldCustomers = state.customers;
  await storageSet('customers', [], true);
  for(const c of oldCustomers){ await storageDelete('tickets:'+c.id, true); }
  await storageSet('ticketCounter', 0, true);
  await storageSet('invoiceNumbers', {}, true);
  await storageSet('invoiceCounter', 0, true);
  await storageSet('paymentDetails', '', true);
  const billingKeys = await storageListKeys('billing:', true);
  for(const k of billingKeys){ await storageDelete(k, true); }
  await storageSet('pendingChanges', [], true);
  await storageSet('users', [ownerUser], true);
  await storageSet('lastManualBackupAt', null, true);

  state.billingCache = {};
  state.tickets = {};
  state.ready = false;
  render();
  await init();
}

/* Runs once per day (whenever someone has the app open that day) — saves a
   full snapshot inside this app's own storage as a safety net. This is NOT a
   substitute for downloading a backup file somewhere external: if the
   hosted link itself is ever lost, these in-app snapshots are lost with it. */
async function runAutoBackupIfNeeded(){
  const today = todayStr();
  const key = 'autobackup:'+today;
  const already = await storageGet(key, true);
  if(already) return;
  const data = await buildBackup();
  await storageSet(key, data, true);
  // keep the most recent 14 daily snapshots, prune older ones
  const keys = await storageListKeys('autobackup:', true);
  const dates = keys.map(k=>k.replace('autobackup:','')).sort();
  const toDelete = dates.slice(0, Math.max(0, dates.length-14));
  for(const d of toDelete){ await storageDelete('autobackup:'+d, true); }
}

/* ---------------- pending-approval counts (for reminders) ---------------- */
function myPendingTicketApprovals(){
  if(!state.currentUser || (state.currentUser.role!=='admin' && state.currentUser.role!=='owner')) return 0;
  let count = 0;
  state.customers.forEach(c=>{
    ticketsFor(c.id).forEach(t=>{
      const approvals = t.approvals || [];
      if(approvals.length<2 && !approvals.some(a=>a.byId===state.currentUser.id)) count++;
    });
  });
  return count;
}
function myPendingChangeApprovals(){
  if(!state.currentUser) return 0;
  if(state.currentUser.role==='admin') return state.pendingChanges.filter(p=> p.status==='pending_admin_approval' && p.proposedBy!==currentUserName()).length;
  if(state.currentUser.role==='owner') return state.pendingChanges.filter(p=> p.status==='pending_owner_approval').length;
  return 0;
}
function backupDueToday(){
  if(!state.currentUser || (state.currentUser.role!=='admin' && state.currentUser.role!=='owner')) return false;
  if(!state.lastManualBackupAt) return true;
  return state.lastManualBackupAt.slice(0,10) !== todayStr();
}

/* ---------------- login / accounts ---------------- */
function deviceLabel(){
  const ua = navigator.userAgent || '';
  let os = 'Unknown device';
  if(/iPad/i.test(ua)) os = 'iPad';
  else if(/iPhone/i.test(ua)) os = 'iPhone';
  else if(/Android/i.test(ua)) os = /Mobile/i.test(ua) ? 'Android phone' : 'Android tablet';
  else if(/Windows/i.test(ua)) os = 'Windows';
  else if(/Macintosh/i.test(ua)) os = 'Mac';
  else if(/Linux/i.test(ua)) os = 'Linux';
  let browser = 'browser';
  if(/Edg\//i.test(ua)) browser = 'Edge';
  else if(/Chrome\//i.test(ua) && !/Edg/i.test(ua)) browser = 'Chrome';
  else if(/Firefox\//i.test(ua)) browser = 'Firefox';
  else if(/Safari\//i.test(ua) && !/Chrome/i.test(ua)) browser = 'Safari';
  return `${browser} on ${os}`;
}

async function loginAs(userId, pin){
  const u = state.users.find(x=>x.id===userId && x.active!==false);
  if(!u) return false;
  if((u.pin||'') !== (pin||'')) return false;
  const updated = state.users.map(x=> x.id===u.id ? { ...x, lastDevice: deviceLabel(), lastLoginAt: new Date().toISOString() } : x);
  state.users = updated;
  await storageSet('users', updated, true);
  state.currentUser = updated.find(x=>x.id===u.id);
  await storageSet('currentUserId', u.id, false); // personal — this device only
  render();
  return true;
}
async function logoutUser(){
  state.currentUser = null;
  state.loginPinFor = null;
  state.hasUnsavedDraft = false;
  await storageSet('currentUserId', '', false);
  render();
}

/* ---------------- signature pad ---------------- */
function setupSignaturePad(canvas, clearBtn, onChange){
  const ratio = window.devicePixelRatio || 1;
  canvas.width = canvas.clientWidth * ratio;
  canvas.height = canvas.clientHeight * ratio;
  const ctx = canvas.getContext('2d');
  ctx.scale(ratio, ratio);
  ctx.lineWidth = 2; ctx.lineCap = 'round'; ctx.strokeStyle = '#1c1917';
  let drawing = false, hasInk = false;
  const pos = (e) => { const r = canvas.getBoundingClientRect(); const t = e.touches ? e.touches[0] : e; return {x:t.clientX-r.left, y:t.clientY-r.top}; };
  const start = (e) => { e.preventDefault(); drawing = true; const p = pos(e); ctx.beginPath(); ctx.moveTo(p.x,p.y); };
  const move = (e) => { if(!drawing) return; e.preventDefault(); const p = pos(e); ctx.lineTo(p.x,p.y); ctx.stroke(); hasInk = true; };
  const end = () => { if(!drawing) return; drawing = false; if(hasInk) onChange(canvas.toDataURL('image/png')); };
  canvas.addEventListener('mousedown', start); canvas.addEventListener('mousemove', move);
  canvas.addEventListener('mouseup', end); canvas.addEventListener('mouseleave', end);
  canvas.addEventListener('touchstart', start, {passive:false}); canvas.addEventListener('touchmove', move, {passive:false}); canvas.addEventListener('touchend', end);
  clearBtn.addEventListener('click', ()=>{ ctx.clearRect(0,0,canvas.width,canvas.height); hasInk=false; onChange(null); });
}

function mergeDeliverItems(ticket, f){
  return ticket.items.map(it=>({
    ...it,
    deliveryQty: f.delivered[it.itemId] ?? it.deliveryQty ?? 0,
    remarks: (f.remarks[it.itemId] ?? it.remarks ?? '').trim ? (f.remarks[it.itemId] ?? it.remarks ?? '').trim() : '',
  }));
}

function renderDeliverTable(ticket){
  const f = state.deliverForm;
  const box = document.getElementById('dl-table');
  const grouped = groupByCategory(ticket.items.map(it=>({...it})));
  let rowNo = 0;
  const bodyHtml = grouped.map(({cat, items})=>{

      rowNo++;
      const d = f.delivered[it.itemId] ?? it.deliveryQty ?? 0;

      const over = remainder<0 ? Math.abs(remainder) : 0;

      return `
      <tr data-row="${it.itemId}">

    const remainder = it.pickupQty - f.delivered[id];
    const short = remainder>0 ? remainder : 0;

    box.querySelector(`[data-short="${id}"]`).textContent = short || '–';
    box.querySelector(`[data-over="${id}"]`).textContent = over || '–';
  }));
  box.querySelectorAll('[data-remark]').forEach(inp=> inp.addEventListener('input', ()=>{ f.remarks[inp.dataset.remark]=inp.value; }));

/* ================= OFFICE VIEW ================= */
function renderOffice(container){
  const o = state.office;
  // switching Office tabs (including into Users/Customers) starts a fresh, un-dirty draft
  state.hasUnsavedDraft = false;
  const role = state.currentUser ? state.currentUser.role : 'worker';
  const pendingCount = state.pendingChanges.filter(p=> p.status!=='approved' && p.status!=='rejected').length;
  const myTickets = myPendingTicketApprovals();
  const myChanges = myPendingChangeApprovals();
  const backupAlert = backupDueToday();
  container.innerHTML = `
    <div class="ticket-header"><div><div class="eyebrow">Review only</div><div class="title">Office</div></div></div>
    ${backupAlert ? `
    <div class="cust-card" style="background:var(--rose-50);border:1px solid var(--rose-100);">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;">
        <div>
          <div style="font-weight:800;font-size:13px;color:var(--rose-600);">⚠ Today's backup hasn't been downloaded</div>
          <div style="font-size:12px;color:var(--stone-500);margin-top:2px;">${state.lastManualBackupAt ? `Last downloaded ${fmtDate(state.lastManualBackupAt.slice(0,10))}` : 'No backup has ever been downloaded yet'} — this is the copy that survives outside this app.</div>
        </div>
        <div style="display:flex;gap:8px;">
          <button id="office-backup-now" class="btn-dark" style="background:var(--rose-600);white-space:nowrap;">Download now</button>
          ${role==='owner' ? `<button id="office-backup-dismiss" class="btn-outline" style="white-space:nowrap;">Dismiss for today</button>` : ''}
        </div>
      </div>
    </div>` : ''}
    ${(myTickets+myChanges) ? `
    <div class="cust-card" style="background:var(--amber-50);border:1px solid var(--amber-100);">
      <div style="font-weight:800;font-size:13px;margin-bottom:6px;color:var(--amber-800);">Needs your approval</div>
      <div style="display:flex;gap:16px;flex-wrap:wrap;font-size:13px;">
        ${myTickets ? `<button data-jump="tickets" class="link-btn" style="font-size:13px;">${myTickets} pickup/delivery ticket${myTickets>1?'s':''} →</button>` : ''}
        ${myChanges ? `<button data-jump="approvals" class="link-btn" style="font-size:13px;">${myChanges} Customers &amp; Items change${myChanges>1?'s':''} →</button>` : ''}
      </div>
    </div>` : ''}
    <div class="office-tabs">
      <button data-tab="tickets" class="${o.tab==='tickets'?'active':''}">Tickets</button>
      <button data-tab="register" class="${o.tab==='register'?'active':''}">Register</button>
      <button data-tab="billing" class="${o.tab==='billing'?'active':''}">Invoices</button>
      <button data-tab="sales" class="${o.tab==='sales'?'active':''}">Sales</button>
      <button data-tab="admin" class="${o.tab==='admin'?'active':''}">Customers</button>
      <button data-tab="approvals" class="${o.tab==='approvals'?'active':''}">Approvals${pendingCount?' ('+pendingCount+')':''}</button>
      <button data-tab="users" class="${o.tab==='users'?'active':''}">Users</button>
    </div>
    <div id="office-body"></div>
  `;
  container.querySelectorAll('[data-tab]').forEach(b=> b.addEventListener('click', ()=>{ o.tab=b.dataset.tab; renderOffice(container); }));
  container.querySelectorAll('[data-jump]').forEach(b=> b.addEventListener('click', ()=>{ o.tab=b.dataset.jump; renderOffice(container); }));
  const backupNowBtn = container.querySelector('#office-backup-now');
  if(backupNowBtn) backupNowBtn.addEventListener('click', async ()=>{
    backupNowBtn.disabled = true; backupNowBtn.textContent = 'Preparing…';
    await downloadBackup();
    showToast('Backup downloaded');
    renderOffice(container);
  });
  const backupDismissBtn = container.querySelector('#office-backup-dismiss');
  if(backupDismissBtn) backupDismissBtn.addEventListener('click', async ()=>{
    if(!confirm("Dismiss today's backup alert without actually downloading a backup?")) return;
    await dismissBackupAlertToday();
    showToast('Alert dismissed for today');
    renderOffice(container);
  });
  const body = document.getElementById('office-body');
  if(o.tab==='tickets') renderTicketsTab(body);
  else if(o.tab==='register') renderRegisterTab(body);
  else if(o.tab==='billing') renderBillingTab(body);
  else if(o.tab==='sales') renderSalesTab(body);
  else if(o.tab==='users') renderUsersTab(body, role);
  else if(o.tab==='approvals') renderApprovalsTab(body, role);
  else renderAdminTab(body);
}

/* ---------- Approvals tab ---------- */
function renderApprovalsTab(box, role){
  function draw(){
    const mine = currentUserName();
    const pendingAdmin = state.pendingChanges.filter(p=> p.status==='pending_admin_approval');
    const pendingOwner = state.pendingChanges.filter(p=> p.status==='pending_owner_approval');
    const history = state.pendingChanges.filter(p=> p.status==='approved' || p.status==='rejected')
      .sort((a,b)=> (b.ownerApprovedAt||b.rejectedAt||'').localeCompare(a.ownerApprovedAt||a.rejectedAt||'')).slice(0,10);

    const cardFor = (p, stage) => {
      const custNames = p.customersSnapshot.map(c=>c.name).join(', ');
      const canAct = stage==='admin' ? (role==='admin' && p.proposedBy!==mine) || role==='owner' : role==='owner';
      return `
      <div class="card">
        <div style="font-weight:800;">Customers &amp; Items update</div>
        <div style="font-size:12px;color:var(--stone-500);margin-bottom:6px;">Proposed by ${esc(p.proposedBy)} · ${new Date(p.proposedAt).toLocaleString('en-GB')}</div>
        <div style="font-size:12px;margin-bottom:8px;">Touches: ${esc(custNames)}</div>
        ${p.adminApprovedBy ? `<div style="font-size:12px;color:var(--teal-700);margin-bottom:6px;">✓ Admin-approved by ${esc(p.adminApprovedBy)}</div>` : ''}
        ${canAct ? `
          <div class="btn-row">
            <button data-reject="${p.id}" class="btn-outline" style="border-color:var(--rose-600)!important;color:var(--rose-600);">Reject</button>
            <button data-approve="${p.id}|${stage}" class="btn-primary">${stage==='admin' ? 'Approve (Admin)' : 'Give final approval (Owner)'}</button>
          </div>
        ` : `<div style="font-size:12px;color:var(--stone-400);font-style:italic;">${stage==='admin' ? 'Waiting on a different Admin to approve this.' : 'Waiting on the Owner.'}</div>`}
      </div>`;
    };

    box.innerHTML = `
      <div class="section-label"><span>Needs an Admin's approval</span></div>
      ${pendingAdmin.length ? pendingAdmin.map(p=>cardFor(p,'admin')).join('') : `<div class="empty-note">Nothing waiting here.</div>`}

      <div class="section-label" style="margin-top:16px;"><span>Needs the Owner's final approval</span></div>
      ${pendingOwner.length ? pendingOwner.map(p=>cardFor(p,'owner')).join('') : `<div class="empty-note">Nothing waiting here.</div>`}

      ${history.length ? `
      <div class="section-label" style="margin-top:16px;"><span>Recent history</span></div>
      ${history.map(p=>`
        <div class="card" style="opacity:.7;">
          <div style="font-size:12px;">${p.status==='approved' ? '✓ Approved' : '✕ Rejected'} — proposed by ${esc(p.proposedBy)}${p.status==='approved' ? `, final approval by ${esc(p.ownerApprovedBy)}` : ''}</div>
        </div>`).join('')}
      ` : ''}
    `;

    box.querySelectorAll('[data-approve]').forEach(btn=> btn.addEventListener('click', async ()=>{
      const [id, stage] = btn.dataset.approve.split('|');
      const list = state.pendingChanges.map(p=>{
        if(p.id!==id) return p;
        if(stage==='admin') return { ...p, status:'pending_owner_approval', adminApprovedBy: mine, adminApprovedAt: new Date().toISOString() };
        return { ...p, status:'approved', ownerApprovedBy: mine, ownerApprovedAt: new Date().toISOString() };
      });
      await savePendingChanges(list);
      if(stage==='owner'){
        const p = list.find(x=>x.id===id);
        await saveCustomers(p.customersSnapshot);
        state.paymentDetails = p.paymentDetailsSnapshot;
        await storageSet('paymentDetails', p.paymentDetailsSnapshot, true);
        showToast('Approved and published');
      } else {
        showToast('Approved — now needs the Owner');
      }
      draw();
    }));
    box.querySelectorAll('[data-reject]').forEach(btn=> btn.addEventListener('click', async ()=>{
      if(!confirm('Reject this change? It will not be applied.')) return;
      const list = state.pendingChanges.map(p=> p.id===btn.dataset.reject ? { ...p, status:'rejected', rejectedBy: mine, rejectedAt: new Date().toISOString() } : p);
      await savePendingChanges(list);
      showToast('Rejected');
      draw();
    }));
  }
  draw();
}

function renderUsersTab(box, role){
  // Owner sees & manages everyone (Admins + Workers). Admin manages Workers only. Worker never sees this (no Office nav).
  let localUsers = JSON.parse(JSON.stringify(state.users));
  localUsers.forEach(u=>{ u._rowKey = u.id; }); // stable DOM binding even if the owner edits the User ID itself
  let dirty = false;

  function markDirty(){
    dirty = true;
    state.hasUnsavedDraft = true;
    const btn = box.querySelector('#us-save');
    if(btn){ btn.disabled = false; btn.textContent = 'Save changes'; }
  }

  function draw(){
    const manageable = role==='owner' ? localUsers : localUsers.filter(u=> u.role==='worker');
    const addableRoles = role==='owner' ? ['admin','worker'] : ['worker'];
    const daysLeft = Math.ceil((new Date(state.securityKey.expiresAt) - new Date())/86400000);

    box.innerHTML = `
      ${role==='owner' ? `
      <div class="cust-card" style="background:var(--stone-50);">
        <div class="section-label"><span>Security key</span><span style="font-weight:600;text-transform:none;letter-spacing:0;">renews every year</span></div>
        <div class="mono" style="font-size:13px;font-weight:800;margin-bottom:4px;">${esc(state.securityKey.key)}</div>
        <div style="font-size:12px;color:${daysLeft<=30?'var(--rose-600)':'var(--stone-500)'};margin-bottom:10px;">
          Valid until ${fmtDate(state.securityKey.expiresAt.slice(0,10))} (${daysLeft} day${daysLeft===1?'':'s'} left) · last set by ${esc(state.securityKey.setBy)}
        </div>
        <button id="us-renewkey" class="btn-outline" style="padding:8px 14px;">Renew now (resets to 1 year)</button>
      </div>` : ''}

      <div class="section-label"><span>${role==='owner' ? 'All users' : 'Workers'}</span><span style="font-weight:600;text-transform:none;letter-spacing:0;">${role==='owner' ? 'User ID, password, and last device for every account' : 'You can add and manage Worker accounts'}</span></div>

      <div class="cust-card">
        <div class="row2" style="margin-bottom:8px;">
          <input id="us-newname" type="text" class="field-input" placeholder="Name" />
          <select id="us-newrole" class="field-input">
            ${addableRoles.map(r=>`<option value="${r}">${r[0].toUpperCase()+r.slice(1)}</option>`).join('')}
          </select>
        </div>
        <div class="row2" style="margin-bottom:0;">
          <input id="us-newpin" type="text" inputmode="numeric" pattern="[0-9]*" class="field-input mono" placeholder="4-digit password" maxlength="8" />
          <button id="us-add" class="btn-dark" style="background:var(--teal-700);">Add account</button>
        </div>
      </div>

      <div id="us-list"></div>

      <button id="us-save" class="btn-primary" ${dirty?'':'disabled'} style="width:100%;margin-top:8px;">${dirty?'Save changes':'Saved'}</button>
    `;

    const list = box.querySelector('#us-list');
    list.innerHTML = manageable.map(u=>{
      const isMe = state.currentUser && u.id===state.currentUser.id;
      return `
      <div class="cust-card" style="margin-bottom:8px;">
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px;">
          <span style="font-weight:800;flex:1;">${esc(u.name)}${isMe?' (you)':''}</span>
          <span class="pill ${u.role==='admin'?'open':u.role==='owner'?'closed':''}" style="margin-bottom:0;${u.role==='worker'?'background:var(--stone-100);color:var(--stone-500);':''}">${u.role}</span>
        </div>
        <div class="row2" style="margin-bottom:0;">
          <div>
            <label class="field-label">User ID</label>
            ${role==='owner'
              ? `<input type="text" class="field-input mono" data-userid="${u._rowKey}" value="${esc(u.id)}" style="font-size:12px;padding:7px 10px;" />`
              : `<div class="mono" style="font-size:11px;color:var(--stone-400);">${esc(u.id)}</div>`}
          </div>
          <div>
            <label class="field-label">Password (PIN)</label>
            <input type="text" inputmode="numeric" pattern="[0-9]*" class="field-input mono" data-pin="${u._rowKey}" value="${esc(u.pin||'')}" style="max-width:140px;" />
          </div>
        </div>
        <div style="font-size:11px;color:var(--stone-400);margin-top:8px;">
          <b style="color:var(--stone-500);">Device:</b> ${u.lastDevice ? esc(u.lastDevice) : 'Never logged in'}${u.lastLoginAt ? ' · last seen '+new Date(u.lastLoginAt).toLocaleString('en-GB',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'}) : ''}
        </div>
        ${u.role!=='owner' ? `<button data-remove="${u._rowKey}" class="link-btn" style="color:var(--rose-600);margin-top:8px;">Remove account</button>` : ''}
      </div>`;
    }).join('') || `<div style="font-size:12px;color:var(--stone-400);font-style:italic;">No accounts yet.</div>`;

    const renewBtn = box.querySelector('#us-renewkey');
    if(renewBtn) renewBtn.addEventListener('click', async ()=>{
      if(!confirm('Renew the security key for another year starting today?')) return;
      await renewSecurityKey();
      showToast('Security key renewed for 1 year');
      draw();
    });

    box.querySelector('#us-add').addEventListener('click', ()=>{
      const name = box.querySelector('#us-newname').value.trim();
      const r = box.querySelector('#us-newrole').value;
      const pin = box.querySelector('#us-newpin').value.trim();
      if(!name){ showToast('Enter a name'); return; }
      if(!pin){ showToast('Set a password'); return; }
      const id = uid();
      localUsers.push({ id, name, role: r, pin, active: true, _rowKey: id });
      markDirty(); draw();
    });

    list.querySelectorAll('[data-pin]').forEach(inp=> inp.addEventListener('change', ()=>{
      const u = localUsers.find(x=>x._rowKey===inp.dataset.pin);
      if(u){ u.pin = inp.value.trim(); markDirty(); }
    }));
    list.querySelectorAll('[data-userid]').forEach(inp=> inp.addEventListener('change', ()=>{
      const u = localUsers.find(x=>x._rowKey===inp.dataset.userid);
      if(!u) return;
      const newId = inp.value.trim();
      if(!newId){ showToast("User ID can't be blank"); inp.value = u.id; return; }
      if(localUsers.some(x=>x._rowKey!==u._rowKey && x.id===newId)){
        showToast('That User ID is already taken');
        inp.value = u.id;
        return;
      }
      u.id = newId;
      markDirty();
    }));
    list.querySelectorAll('[data-remove]').forEach(b=> b.addEventListener('click', ()=>{
      const u = localUsers.find(x=>x._rowKey===b.dataset.remove);
      if(!confirm(`Remove ${u.name}'s account? They will no longer be able to log in or see anything. Their name stays on past pickup/delivery tickets for the record.`)) return;
      localUsers = localUsers.filter(x=>x._rowKey!==b.dataset.remove);
      markDirty(); draw();
    }));

    box.querySelector('#us-save').addEventListener('click', async ()=>{
      const cleaned = localUsers.map(({_rowKey, ...u})=> u);
      await saveUsers(cleaned);
      dirty=false; state.hasUnsavedDraft = false; draw(); showToast('Saved');
    });
  }
  draw();
}

/* ---------- Tickets tab ---------- */
function renderTicketsTab(box){
  const o = state.office;
  box.innerHTML = `
    <div class="row3" style="grid-template-columns:1fr 1fr 1fr;">
      <div><label class="field-label">Status</label>
        <select id="tk-status" class="field-input">
          <option value="open" ${o.statusFilter==='open'?'selected':''}>Open (awaiting delivery)</option>
          <option value="closed" ${o.statusFilter==='closed'?'selected':''}>Closed (delivered)</option>
          <option value="all" ${o.statusFilter==='all'?'selected':''}>All</option>
        </select>
      </div>
      <div style="grid-column:span 2;"><label class="field-label">Customer</label>
        <select id="tk-cust" class="field-input">
          <option value="all" ${o.custFilter==='all'?'selected':''}>All customers</option>
          ${state.customers.map(c=>`<option value="${c.id}" ${o.custFilter===c.id?'selected':''}>${esc(c.name)}</option>`).join('')}
        </select>
      </div>
    </div>
    <div id="tk-list"></div>
  `;
  box.querySelector('#tk-status').addEventListener('change', e=>{ o.statusFilter = e.target.value; renderTicketList(); });
  box.querySelector('#tk-cust').addEventListener('change', e=>{ o.custFilter = e.target.value; renderTicketList(); });
  renderTicketList();
}

function renderTicketList(){
  const o = state.office;
  const list = document.getElementById('tk-list');
  const rows = [];
  state.customers.filter(c=> o.custFilter==='all' || c.id===o.custFilter).forEach(c=>{
    ticketsFor(c.id).filter(t=> o.statusFilter==='all' || t.status===o.statusFilter).forEach(t=> rows.push({cust:c, t}));
  });
  rows.sort((a,b)=> b.t.ticketNo - a.t.ticketNo);

  if(rows.length===0){ list.innerHTML = `<div class="empty-note">No tickets match this filter.</div>`; return; }

  list.innerHTML = rows.map(({cust,t})=> ticketCardHtml(cust,t)).join('');
  list.querySelectorAll('[data-approvebtn]').forEach(btn=>{
    btn.addEventListener('click', async e=>{
      const [custId, ticketId] = e.target.dataset.approvebtn.split('|');
      const t = ticketsFor(custId).find(x=>x.id===ticketId);
      const approvals = t.approvals || [];
      if(approvals.length>=2 || approvals.some(a=>a.byId===state.currentUser.id)) return;
      const next = [...approvals, { by: currentUserName(), byId: state.currentUser.id, at: new Date().toISOString() }];
      await updateTicket(custId, ticketId, {
        approvals: next,
        reviewed: next.length>=2, // kept for any older code paths that still check .reviewed
      });
      renderTicketList();
    });
  });
  list.querySelectorAll('[data-unapprove]').forEach(btn=>{
    btn.addEventListener('click', async e=>{
      const [custId, ticketId] = e.target.dataset.unapprove.split('|');
      if(!confirm('Remove your approval from this ticket?')) return;
      const t = ticketsFor(custId).find(x=>x.id===ticketId);
      const next = (t.approvals||[]).filter(a=> a.byId!==state.currentUser.id);
      await updateTicket(custId, ticketId, { approvals: next, reviewed: next.length>=2 });
      renderTicketList();
    });
  });
  list.querySelectorAll('[data-printticket]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const [custId, ticketId] = btn.dataset.printticket.split('|');
      const t = ticketsFor(custId).find(x=>x.id===ticketId);
      const cust = state.customers.find(c=>c.id===custId);
      buildPrintTicket({
        ticketNo: t.ticketNo, date: t.date, customerName: cust.name, stage: t.status==='closed'?'delivered':'pickup',
        items: t.items, collectedBy: t.collectedBy, pickUpBy: t.pickUpBy, deliveryBy: t.deliveryBy, receivedBy: t.receivedBy, deliveredDate: t.deliveredDate,
      });
      window.print();
    });
  });
}

function ticketCardHtml(cust, t){
  const pickupTotal = t.items.reduce((a,i)=>a+i.pickupQty,0);
  const deliveryTotal = t.items.reduce((a,i)=>a+(i.deliveryQty||0),0);
  const shortItems = t.status==='closed' ? t.items.filter(i=> i.pickupQty - (i.deliveryQty||0) > 0) : [];
  const overItems = t.status==='closed' ? t.items.filter(i=> i.pickupQty - (i.deliveryQty||0) < 0) : [];
  const remarkItems = t.items.filter(i=> i.remarks);
  const age = t.status==='open' ? Math.max(0, Math.round((new Date(todayStr())-new Date(t.date))/86400000)) : null;
  const approvals = t.approvals || [];
  const fullyApproved = approvals.length>=2;
  const myId = state.currentUser ? state.currentUser.id : null;
  const alreadyApprovedByMe = approvals.some(a=>a.byId===myId);
  const canApprove = state.currentUser && (state.currentUser.role==='admin' || state.currentUser.role==='owner') && !fullyApproved && !alreadyApprovedByMe;

  return `
    <div class="card ${fullyApproved?'':'unreviewed'}">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;">
        <div>
          <span class="pill ${t.status}">${t.status==='open'?'Open':'Closed'}</span>
          ${t.status==='open' && t.packedAt ? `<span class="pill" style="background:var(--sky-100);color:var(--sky-800);">Amounts saved</span>` : ''}
          ${age!==null && age>0 ? `<span class="age-tag mono">${age}d outstanding</span>` : ''}
          <div style="font-weight:800;">${esc(cust.name)} <span class="mono" style="color:var(--stone-400);font-weight:700;">#${padTicket(t.ticketNo)}</span></div>
          <div style="font-size:11px;color:var(--stone-400);">Picked up ${fmtDate(t.date)} by ${esc(t.worker||'—')}${t.deliveredDate ? ' · Delivered '+fmtDate(t.deliveredDate)+' by '+esc(t.deliveryWorker||'—') : ''}</div>
        </div>
        <div style="text-align:right;">
          <div class="mono" style="font-weight:900;font-size:16px;">${pickupTotal}${deliveryTotal>0 ? ' → '+deliveryTotal : ''}</div>
          <div style="font-size:9px;color:var(--stone-400);text-transform:uppercase;">pickup${deliveryTotal>0?' → delivery':''}</div>
        </div>
      </div>
      <div style="margin-top:8px;">
        ${t.items.map(i=>`<span class="chip mono">${esc(i.name)} ${i.pickupQty}${t.status==='closed' ? '→'+(i.deliveryQty||0) : ''}</span>`).join('')}
      </div>
      ${shortItems.length? `<div class="flag-short">△ Short: ${shortItems.map(i=>`${esc(i.name)} −${i.pickupQty-(i.deliveryQty||0)}`).join(', ')}</div>`:''}
      ${overItems.length? `<div class="flag-over">⚠ Over: ${overItems.map(i=>`${esc(i.name)} +${(i.deliveryQty||0)-i.pickupQty}`).join(', ')}</div>`:''}
      ${remarkItems.length? `<div style="font-size:12px;color:var(--stone-600);margin-top:4px;">📝 ${remarkItems.map(i=>`<b>${esc(i.name)}:</b> ${esc(i.remarks)}`).join(' · ')}</div>`:''}

function renderRegisterTable(){
  const o = state.office;
  const box = document.getElementById('rg-table');
  const custId = o.registerCust;
  const tickets = ticketsFor(custId);
  if(!custId){ box.innerHTML=''; return; }

  const [year, mon] = o.registerMonth.split('-').map(Number);
  const daysInMonth = new Date(year, mon, 0).getDate();
  const dayList = Array.from({length:daysInMonth}, (_,i)=>i+1);
  const dateStr = (day) => `${o.registerMonth}-${String(day).padStart(2,'0')}`;

  const custObj = state.customers.find(c=>c.id===custId);
  const items = custObj ? custObj.items : [];
  const perDay = (itemId, day) => {
    const d = dateStr(day);
    const picked = tickets.filter(t=>t.date===d).reduce((a,t)=> a+(t.items.find(i=>i.itemId===itemId)?.pickupQty||0),0);
    const delivered = tickets.filter(t=>t.deliveredDate===d).reduce((a,t)=> a+(t.items.find(i=>i.itemId===itemId)?.deliveryQty||0),0);
    return {picked, delivered};
  };
  const owedNow = (itemId) => tickets.reduce((a,t)=>{
    const it = t.items.find(i=>i.itemId===itemId);
    if(!it) return a;
    return a + (it.pickupQty - (it.deliveryQty||0));
  }, 0);
  const usedItems = items.filter(it => tickets.some(t=> t.items.some(i=>i.itemId===it.id)));
  const totalOwed = usedItems.reduce((a,it)=> a+owedNow(it.id), 0);

  let head1 = `<th class="itemname">Item</th>` + dayList.map(d=>`<th>${d}</th>`).join('') + `<th class="owed-cell2" style="border-left-width:2px;">Owed</th>`;
  let head2 = `<th class="itemname">Picked / Delivered</th>` + dayList.map(()=>`<th></th>`).join('') + `<th></th>`;

  let bodyRows = (usedItems.length ? usedItems : items).map(it=>{
    const owed = owedNow(it.id);
    const cells = dayList.map(d=>{
      const {picked,delivered} = perDay(it.id,d);
      if(!picked && !delivered) return `<td class="mono" style="color:var(--stone-200)">·</td>`;
      return `<td class="mono"><span style="color:var(--sky-700)">${picked||'·'}</span>/<span style="color:var(--teal-700)">${delivered||'·'}</span></td>`;
    }).join('');
    const owedCls = owed>0?'owed-pos':(owed<0?'owed-neg':'');
    return `<tr><td class="itemname">${esc(it.name)}</td>${cells}<td class="mono owed-cell2 ${owedCls}">${owed}</td></tr>`;
  }).join('');

  const totalCells = dayList.map(d=>{
    const picked = items.reduce((a,it)=> a+perDay(it.id,d).picked,0);
    const delivered = items.reduce((a,it)=> a+perDay(it.id,d).delivered,0);
    if(!picked && !delivered) return `<td class="mono" style="color:var(--stone-200)">·</td>`;
    return `<td class="mono" style="font-weight:800;"><span style="color:var(--sky-700)">${picked}</span>/<span style="color:var(--teal-700)">${delivered}</span></td>`;
  }).join('');

  box.innerHTML = `
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
      <div style="font-size:14px;"><b>Outstanding balance:</b> <span class="mono" style="font-weight:900;color:${totalOwed>0?'var(--amber-700)':'var(--stone-400)'}">${totalOwed} items</span></div>
      <button id="rg-export" class="btn-dark">Export CSV</button>
    </div>
    <div class="register-wrap">
      <table class="register">
        <thead><tr>${head1}</tr><tr>${head2}</tr></thead>
        <tbody>
          ${bodyRows || `<tr><td class="itemname" colspan="${dayList.length+2}" style="color:var(--stone-400);font-style:italic;">No activity yet.</td></tr>`}
          <tr style="border-top:2px solid var(--stone-300);background:var(--stone-50);">
            <td class="itemname" style="font-weight:900;text-transform:uppercase;">Total</td>
            ${totalCells}
            <td class="mono owed-cell2" style="font-weight:900;">${totalOwed}</td>
          </tr>
        </tbody>
      </table>
    </div>
    <div class="legend"><span style="color:var(--sky-700);font-weight:800;">Picked</span> / <span style="color:var(--teal-700);font-weight:800;">Delivered</span> per day (delivered counted on its delivery date). <b>Owed</b> = cumulative pickup minus delivery across all tickets — stays positive while short/still open, turns <span style="color:var(--rose-600);font-weight:800;">red</span> on an over.</div>
  `;

  box.querySelector('#rg-export').addEventListener('click', ()=>{
    const rowsSrc = usedItems.length ? usedItems : items;
    const lines = [];
    lines.push(['Item', ...dayList.flatMap(d=>[`${d} Picked`,`${d} Delivered`]), 'Owed (Balance)'].join(','));
    rowsSrc.forEach(it=>{
      const cells = dayList.flatMap(d=>{ const {picked,delivered}=perDay(it.id,d); return [picked,delivered]; });
      lines.push([`"${it.name}"`, ...cells, owedNow(it.id)].join(','));
    });
    const blob = new Blob([lines.join('\n')], {type:'text/csv'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const custName = state.customers.find(c=>c.id===custId)?.name || 'customer';
    a.href = url; a.download = `${custName.replace(/\s+/g,'_')}_register_${o.registerMonth}.csv`;
    a.click(); URL.revokeObjectURL(url);
  });
}

// Derives the "invoice list" from confirmed deliveries: one row per customer per
// billing period (a month for Credit, a day for Cash) that has any delivered sales.
async function exportInvoicesExcel(invoices){
  const rows = [];
  for(let i=0;i<invoices.length;i++){
    const inv = invoices[i];
    const adj = await loadAdjustments(inv.custId, inv.period);
    const discountAmt = resolveAdjAmount(adj.discountType, adj.discountValue, inv.subtotal);
    const expressAmt = resolveAdjAmount(adj.expressType, adj.expressValue, inv.subtotal);
    const total = inv.subtotal - discountAmt + expressAmt;
    const invoiceDate = inv.isCash ? inv.period : inv.periodEnd;
    rows.push({
      'No.': i+1,
      'Customer': inv.custName,
      'Invoice No.': inv.invoiceNo,
      'Invoice Date': fmtDate(invoiceDate),
      'Due Date': inv.isCash ? 'Paid at delivery' : fmtDate(dueDateFor(state.customers.find(c=>c.id===inv.custId)||{}, invoiceDate)),
      'Amount (before discount)': Number(inv.subtotal.toFixed(2)),
      'Discount': Number(discountAmt.toFixed(2)),
      'Express Charge': Number(expressAmt.toFixed(2)),
      'Total Amount': Number(total.toFixed(2)),
    });
  }

  if(window.XLSX){
    const ws = XLSX.utils.json_to_sheet(rows);
    ws['!cols'] = [{wch:5},{wch:26},{wch:14},{wch:14},{wch:16},{wch:20},{wch:12},{wch:14},{wch:14}];
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'Invoices');
    XLSX.writeFile(wb, `invoices_${todayStr()}.xlsx`);
  } else {
    // offline fallback — same columns, as CSV (still opens fine in Excel)
    const cols = ['No.','Customer','Invoice No.','Invoice Date','Due Date','Amount (before discount)','Discount','Express Charge','Total Amount'];
    const lines = [cols.join(',')];
    rows.forEach(r=> lines.push(cols.map(k=> typeof r[k]==='number' ? r[k].toFixed(2) : `"${r[k]}"`).join(',')));
    const blob = new Blob([lines.join('\n')], {type:'text/csv'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = `invoices_${todayStr()}.csv`;
    a.click(); URL.revokeObjectURL(url);
    showToast('Excel library unavailable offline — exported as CSV instead');
  }
}

function fmtInvoiceNo(n){ return 'INV-'+String(n).padStart(6,'0'); }
function ensureInvoiceNo(custId, period){
  const key = custId+':'+period;
  if(state.invoiceNumbers[key]) return state.invoiceNumbers[key];
  state.invoiceCounter += 1;
  const no = fmtInvoiceNo(state.invoiceCounter);
  state.invoiceNumbers[key] = no;
  // persist in the background — callers of listInvoicePeriods() stay synchronous
  storageSet('invoiceNumbers', state.invoiceNumbers, true);
  storageSet('invoiceCounter', state.invoiceCounter, true);
  return no;
}
async function setInvoiceNo(custId, period, value){
  const key = custId+':'+period;
  const clean = (value||'').trim();
  if(!clean) return ensureInvoiceNo(custId, period); // don't allow blanking it out
  state.invoiceNumbers[key] = clean;
  await storageSet('invoiceNumbers', state.invoiceNumbers, true);
  return clean;
}
function dueDateFor(cust, invoiceDate){
  const days = cust.paymentTermsDays==null ? 30 : cust.paymentTermsDays;
  const d = new Date(invoiceDate+'T00:00:00');
  d.setDate(d.getDate() + days);
  return d.toISOString().slice(0,10);
}

function listInvoicePeriods(){
  const rows = [];
  state.customers.forEach(c=>{
    const isCash = c.billingType==='cash';
    const periods = new Set();
    ticketsFor(c.id).forEach(t=>{
      if(!t.deliveredDate) return;
      periods.add(isCash ? t.deliveredDate : t.deliveredDate.slice(0,7));
    });
    periods.forEach(period=>{
      const { start, end } = isCash ? { start:period, end:period } : monthBounds(period);
      const { subtotal } = computeBillingLinesRange(c.id, start, end);
      if(subtotal<=0) return;
      rows.push({ custId:c.id, custName:c.name, isCash, period, subtotal, periodStart:start, periodEnd:end });
    });
  });
  // assign stable invoice numbers oldest-first, so numbering reads naturally over time
  [...rows].sort((a,b)=> a.period.localeCompare(b.period) || a.custName.localeCompare(b.custName))
    .forEach(r=> { r.invoiceNo = ensureInvoiceNo(r.custId, r.period); });
  rows.sort((a,b)=> b.period.localeCompare(a.period) || a.custName.localeCompare(b.custName));
  return rows;
}

function computeBillingLinesRange(custId, fromDate, toDate){
  const cust = state.customers.find(c=>c.id===custId);
  if(!cust) return { cust:null, lines:[], subtotal:0 };
  const tickets = ticketsFor(custId);
  const qtyByItem = {};
  tickets.forEach(t=>{
    if(!t.deliveredDate || t.deliveredDate < fromDate || t.deliveredDate > toDate) return;
    t.items.forEach(it=>{
      if(!it.deliveryQty) return;
      qtyByItem[it.itemId] = (qtyByItem[it.itemId]||0) + it.deliveryQty;
    });
  });
  const lines = cust.items
    .filter(it => qtyByItem[it.id] > 0)
    .map(it => ({ itemId: it.id, name: it.name, category: it.category, qty: qtyByItem[it.id], price: it.price||0, amount: qtyByItem[it.id] * (it.price||0) }));
  const subtotal = lines.reduce((a,l)=> a+l.amount, 0);
  return { cust, lines, subtotal };
}
function computeBillingLines(custId, month){
  const { start, end } = monthBounds(month);
  return computeBillingLinesRange(custId, start, end);
}

// Sum of delivered-item sales value for one customer between two dates (inclusive, 'YYYY-MM-DD').
function computeSalesForRange(custId, fromDate, toDate){
  const cust = state.customers.find(c=>c.id===custId);
  if(!cust) return 0;
  const priceById = {};
  cust.items.forEach(it=> priceById[it.id] = it.price||0);
  return ticketsFor(custId).reduce((sum, t)=>{
    if(!t.deliveredDate || t.deliveredDate < fromDate || t.deliveredDate > toDate) return sum;
    return sum + t.items.reduce((a,it)=> a + (it.deliveryQty||0) * (priceById[it.itemId]||0), 0);
  }, 0);
}
function monthBounds(month){
  const [y,m] = month.split('-').map(Number);
  const start = `${month}-01`;
  const end = `${month}-${String(new Date(y,m,0).getDate()).padStart(2,'0')}`;
  return { start, end };
}

function resolveAdjAmount(type, value, subtotal){
  return type === '%' ? subtotal * ((value||0)/100) : (value||0);
}

async function loadAdjustments(custId, month){
  const key = custId+':'+month;
  if(state.billingCache[key]) return state.billingCache[key];
  let data = await storageGet('billing:'+key, true);
  if(!data){
    data = { discountType:'$', discountValue:0, discountNote:'', expressType:'$', expressValue:0, expressNote:'' };
  }else if(data.discountType===undefined){
    // migrate old plain-$ shape
    data = { discountType:'$', discountValue: data.discount||0, discountNote: data.discountNote||'',
      expressType:'$', expressValue: data.express||0, expressNote: data.expressNote||'' };
  }
  state.billingCache[key] = data;
  return data;
}
async function saveAdjustments(custId, month, data){
  const key = custId+':'+month;
  state.billingCache[key] = data;
  await storageSet('billing:'+key, data, true);
}

function fmtMonth(m){
  if(!m) return '—';
  const [y,mo] = m.split('-').map(Number);
  return new Date(y, mo-1, 1).toLocaleDateString('en-GB', { month:'long', year:'numeric' });
}

function daysInMonthList(month){
  const [year, mon] = month.split('-').map(Number);
  const daysInMonth = new Date(year, mon, 0).getDate();
  return Array.from({length:daysInMonth}, (_,i)=>i+1);
}

  area.innerHTML = `

      <thead><tr>
        <th style="text-align:left;">Item</th>${headDays}

      <tbody>
        ${rowsHtml || `<tr><td colspan="${dayList.length+4}" class="pt-name">— no deliveries confirmed this month —</td></tr>`}
        <tr style="background:#eee;">
          <td class="pt-name" style="font-weight:800;">Daily total</td>
